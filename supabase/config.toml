project_id = "vdb-partners"

# Canonical local ports for THIS project only.
# Do not use 54321/54322 — those belong to other local VDB stacks (e.g. vdb-digital-mobile-local).
#
#   API / Kong:  http://127.0.0.1:54421
#   Database:    postgresql://postgres:postgres@127.0.0.1:54422/postgres
#   Studio:      http://127.0.0.1:54423
#   Mailpit:     http://127.0.0.1:54424
#
[api]
enabled = true
port = 54421
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54422
shadow_port = 54420
major_version = 17

[studio]
enabled = true
port = 54423

[local_smtp]
enabled = true
port = 54424

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = true
