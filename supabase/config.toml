project_id = "vdb-partners"

# Canonical local ports for THIS project only (PARTNER_CLIENT).
# Sibling stacks (do not touch from this repo):
#   VDB Digital 2.0 (CANONICAL_BACKEND_OWNER): 54321–54324, analytics 54327
#   VDB Digital Mobile (MOBILE_CLIENT):         54521–54524
# Do not stop sibling Docker projects from this repository.
#
#   API / Kong:  http://127.0.0.1:54421
#   Database:    postgresql://postgres:postgres@127.0.0.1:54422/postgres
#   Studio:      http://127.0.0.1:54423
#   Mailpit:     http://127.0.0.1:54424
#   Analytics:   http://127.0.0.1:54427
#
[api]
enabled = true
port = 54421
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54422
shadow_port = 54420
major_version = 17

[studio]
enabled = true
port = 54423

[local_smtp]
enabled = true
port = 54424

[analytics]
enabled = true
port = 54427
backend = "postgres"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = true
